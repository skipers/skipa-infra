apiVersion: apps/v1
kind: Deployment
metadata:
  name: skipa-grafana
  namespace: skala3-finalproj-class2-team8
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: skipa-grafana
  template:
    metadata:
      labels:
        app: skipa-grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: skipa-grafana-secret
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skipa-grafana-secret
                  key: admin-password
            - name: GF_SERVER_ROOT_URL
              value: https://grafana-team8-skipa.skala25a.project.skala-ai.com
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards/skipa
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: skipa-grafana-data
        - name: grafana-datasources
          configMap:
            name: skipa-grafana-datasources
        - name: grafana-dashboard-providers
          configMap:
            name: skipa-grafana-dashboard-providers
        - name: grafana-dashboards
          configMap:
            name: skipa-grafana-dashboards

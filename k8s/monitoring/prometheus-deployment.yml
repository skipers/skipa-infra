apiVersion: apps/v1
kind: Deployment
metadata:
  name: skipa-prometheus
  namespace: skala3-finalproj-class2-team8
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: skipa-prometheus
  template:
    metadata:
      labels:
        app: skipa-prometheus
    spec:
      serviceAccountName: skipa-prometheus
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: prometheus-config
          configMap:
            name: skipa-prometheus-config
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: skipa-prometheus-data

apiVersion: apps/v1
kind: Deployment
metadata:
  name: skipa-backend
  namespace: skala3-finalproj-class2-team8
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: skipa-backend
  template:
    metadata:
      labels:
        app: skipa-backend
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: skipa-backend
          image: amdp-registry.skala-ai.com/skala3-finalproj-class2-team8/skipa-backend:dev-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: skipa-backend-secret
                  key: JWT_SECRET

            - name: DB_HOST
              value: skipa-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: skipa-postgres-secret
                  key: database
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: skipa-postgres-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skipa-postgres-secret
                  key: password

            - name: REDIS_HOST
              value: skipa-redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skipa-redis-secret
                  key: password

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
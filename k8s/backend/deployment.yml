apiVersion: apps/v1
kind: Deployment
metadata:
  name: skipa-backend
  namespace: skala3-finalproj-class2-team8
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: skipa-backend
  template:
    metadata:
      labels:
        app: skipa-backend
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: skipa-backend
          image: amdp-registry.skala-ai.com/skala26a-ai2/skipa-backend:dev-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http

          envFrom:
            - configMapRef:
                name: skipa-backend-config

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: skipa-backend-secret
                  key: JWT_SECRET

            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: skipa-backend-secret
                  key: INTERNAL_API_KEY

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: skipa-postgres-secret
                  key: database

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: skipa-postgres-secret
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skipa-postgres-secret
                  key: password

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skipa-redis-secret
                  key: password

            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: skipa-rabbitmq-secret
                  key: username

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skipa-rabbitmq-secret
                  key: password

            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: skipa-minio-secret
                  key: root-user

            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: skipa-minio-secret
                  key: root-password

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
apiVersion: v1
kind: Service
metadata:
  name: skipa-rabbitmq
  namespace: skala3-finalproj-class2-team8
spec:
  type: ClusterIP
  selector:
    app: skipa-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: skipa-rabbitmq-headless
  namespace: skala3-finalproj-class2-team8
spec:
  clusterIP: None
  selector:
    app: skipa-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672

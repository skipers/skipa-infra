apiVersion: apps/v1
kind: Deployment
metadata:
  name: skipa-embedding
  namespace: skala3-finalproj-class2-team8
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: skipa-embedding
  template:
    metadata:
      labels:
        app: skipa-embedding
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: embedding
          image: amdp-registry.skala-ai.com/skala26a-ai2/skipa-model-serving:dev-latest
          imagePullPolicy: Always
          command:
            - python3
            - scripts/serve_embedding.py
          args:
            - --model
            - Qwen/Qwen3-Embedding-4B
            - --host
            - 0.0.0.0
            - --port
            - "8001"
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: HF_HOME
              value: /models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /models/huggingface
          volumeMounts:
            - name: model-cache
              mountPath: /models/huggingface
          startupProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: skipa-embedding-model-cache
